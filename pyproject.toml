[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-luck-score"
version = "0.1.0"
description = "Contact Luck Prototype v0.1 -- a research prototype for measuring fair-batted-ball contact luck in MLB Statcast data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TrueLuckMLBStat contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Private :: Do Not Upload",
]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.6",
    "pyarrow>=14.0",
    "requests>=2.31",
    "pybaseball>=2.2.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "pandas-stubs>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mlb_luck_score"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
# Lets tests import the top-level evaluation/ scripts (Version 1.0's final
# -evaluation harness -- a plain script directory, not part of the installed
# mlb_luck_score package) without sys.path hacks in every test file.
pythonpath = ["evaluation"]

[tool.mypy]
# NOTE: intentionally NOT pinning python_version here. Numpy's bundled type
# stubs use newer-Python-only syntax gated on the running interpreter, and
# pinning this to the project's minimum supported version (3.11) causes
# mypy to mis-evaluate those stubs' version guards on newer interpreters
# (observed on 3.14). Mypy runs against whatever interpreter invokes it.
packages = ["mlb_luck_score"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
