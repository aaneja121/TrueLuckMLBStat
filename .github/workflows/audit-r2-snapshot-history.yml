name: Audit R2 snapshot history

# READ-ONLY provenance audit. Answers one question for named dates: does the
# archive hold a complete snapshot, a partial one, or nothing -- and if not,
# does an exact scored snapshot survive as an Actions artifact, so the date
# could be recovered WITHOUT re-scoring.
#
# It runs here rather than locally because the R2 credentials are Actions
# secrets and should stay that way. Nothing about this audit needs them
# anywhere else.
#
# READ-ONLY BY CONSTRUCTION, not by intention:
#
#   * `scripts/audit_r2_snapshot_history.py` defines its own reader with
#     list/get/head and nothing else. There is no put, upload, copy, delete or
#     multipart method on it, so an R2 write is not something this audit
#     declines to do -- it has no way to express one. It never constructs
#     `archive_snapshot`'s client, which CAN write.
#   * It is given the R2 credentials and nothing else. No
#     CLOUDFLARE_API_TOKEN, so `wrangler` could not deploy even if something
#     invoked it.
#   * `permissions` grants `actions: read` and `contents: read`. No write
#     scope of any kind.
#   * It never scores, never builds the dashboard, never archives, never
#     syncs history, never touches Contact Forecast, and reads no 2026
#     pitcher data. None of those entry points is referenced -- asserted by
#     tests/test_audit_r2_snapshot_history.py.
#
# The report is uploaded as an artifact and contains no credentials.

on:
  workflow_dispatch:
    inputs:
      dates:
        description: >-
          Space-separated YYYY-MM-DD dates to inspect, e.g.
          "2026-09-09 2026-09-10". Required -- the audit never guesses a date.
        required: true
        type: string
      season:
        description: "Season prefix to search, e.g. 2026."
        required: true
        type: string
        default: "2026"
      skip_hash_verification:
        description: >-
          Inventory only, without downloading each object to re-hash it.
          Leave unchecked -- verification is ~13 MB per date and is the
          difference between "the files are listed" and "the files are the
          ones that were archived".
        required: false
        type: boolean
        default: false

# No write scopes. Nothing here may push, comment, release or deploy.
permissions:
  contents: read
  actions: read

# Deliberately NOT the publish/promote group: this audit deploys nothing and
# writes nothing, so it need not queue behind a deploy, and a deploy need not
# wait for it.
concurrency:
  group: audit-r2-snapshot-history
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install boto3 only
        run: python -m pip install --quiet boto3

      - name: Run the read-only audit
        env:
          # The four R2 variables, and nothing else. No Cloudflare API token,
          # no deploy credential, no unrelated secret.
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.PROSPECTIVE_ARCHIVE_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Read-only, for the Actions-artifact half of the audit.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARGS=(--season "${{ inputs.season }}")
          for d in ${{ inputs.dates }}; do
            ARGS+=(--date "$d")
          done
          if [ "${{ inputs.skip_hash_verification }}" = "true" ]; then
            ARGS+=(--skip-hash-verification)
          fi
          python scripts/audit_r2_snapshot_history.py "${ARGS[@]}" \
            --output r2-snapshot-history-audit.json

      - name: Show the findings in the log
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          report = json.load(open("r2-snapshot-history-audit.json"))
          print("status by date:")
          for date, status in sorted(report["status_by_date"].items()):
              print(f"  {date}: {status}")
              record = report["r2"].get(date, {})
              print(f"    R2: {record.get('status')} -- {record.get('detail')}")
              for directory in record.get("directories", []):
                  print(
                      f"      {directory['snapshot_dir_name']}: "
                      f"{directory['n_objects']} objects, complete={directory['complete']}"
                  )
                  for problem in directory.get("problems", []):
                      print(f"        problem: {problem}")
          PY

      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-snapshot-history-audit
          path: r2-snapshot-history-audit.json
          if-no-files-found: warn
          retention-days: 30
